name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: latest = real release from version plans; next = prerelease for early testing
        type: choice
        options: [latest, next]
        default: latest
      dry-run:
        description: Preview only (no versions, tags or packages are written)
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Protected environment: add required reviewers in Settings > Environments > release
    environment: release
    permissions:
      contents: write # push the release commit + tag, create the GitHub release
    env:
      LEFTHOOK: 0
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Git identity for the release commit
        run: |
          git config user.name "lds-release-bot"
          git config user.email "lds-release-bot@users.noreply.github.com"

      - name: Authenticate to JFrog (token stays outside the repo)
        run: pnpm config set "//YOUR-COMPANY.jfrog.io/artifactory/api/npm/lds-npm/:_authToken" "$JFROG_NPM_TOKEN"
        env:
          JFROG_NPM_TOKEN: ${{ secrets.JFROG_NPM_TOKEN }}

      - name: Version, changelog, tag, publish (latest)
        if: inputs.channel == 'latest'
        run: pnpm nx release --yes ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Prerelease (e.g. 0.2.0-next.3) under the "next" tag. No commit or tag; version plans are kept
      # for the real release. Consumers opt in with: pnpm add @tmna-cx-design-system/react@next
      - name: Prerelease (next)
        if: inputs.channel == 'next'
        run: |
          pnpm nx release version prerelease --preid=next --git-commit=false --git-tag=false --stage-changes=false ${{ inputs.dry-run && '--dry-run' || '' }}
          pnpm nx release publish --tag=next ${{ inputs.dry-run && '--dry-run' || '' }}
