# Git hooks. Installed automatically by `pnpm install` (lefthook's postinstall).
# Skip once in an emergency with: LEFTHOOK=0 git commit ...

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml,css,html}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: '*.{js,mjs,cjs,ts,tsx}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    - name: stylelint
      glob: '*.css'
      run: pnpm exec stylelint --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: affected-checks
      # The first push to an empty remote has no origin/main yet: check every project instead.
      run: |
        if git rev-parse --verify --quiet origin/main >/dev/null; then
          pnpm nx affected -t lint typecheck test --base=origin/main --head=HEAD
        else
          pnpm nx run-many -t lint typecheck test
        fi
