# Which folders hold workspace packages
packages:
  - 'packages/*'
  - 'packages/organisms/*'
  - 'apps/*'
  - 'tools/*'

# ---------- Supply-chain safety ----------
# Only these packages may run install scripts (postinstall etc.)
allowBuilds:
  nx: true
  esbuild: true
  '@swc/core': true
  lefthook: true
# Fail the install if a package that is NOT in allowBuilds wants to run a script
strictDepBuilds: true
# Refuse versions published less than 1 day ago (minutes)
minimumReleaseAge: 1440
# Our own packages are exempt so a fresh release can be consumed right away
minimumReleaseAgeExclude:
  - '@tmna-cx-design-system/*'
  - '@tmna-cx-ds-organisms/*'
# Refuse a new version if its publish trust level dropped (e.g. lost provenance)
trustPolicy: no-downgrade
# Only judge versions published in the last 30 days (old packages like semver@6 predate provenance)
trustPolicyIgnoreAfter: 43200

# ---------- Dependency behaviour ----------
autoInstallPeers: true
# Workspace packages must be referenced with workspace:* (never pulled from JFrog by accident)
linkWorkspacePackages: false
saveWorkspaceProtocol: rolling

# ---------- One place for shared versions ----------
# Packages write "typescript": "catalog:" instead of a version number
catalogMode: strict
catalog:
  nx: 23.3.0
  '@nx/js': 23.3.0
  prettier: ^3.9.10
  '@swc/helpers': ~0.5.18
  typescript: ~6.0.3
  style-dictionary: ^5.6.1
  lightningcss: ^1.33.0
  '@stencil/core': ^4.45.2
  '@stencil/react-output-target': ^1.6.5
  '@stencil/angular-output-target': ^1.5.2
  browserslist: ^4.28.1
  tslib: ^2.8.1
  '@nx/eslint': 23.3.0
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@eslint/js': ^10.0.1
  '@nx/eslint-plugin': 23.3.0
  '@typescript-eslint/parser': ^8.71.2
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  jiti: ^2.7.0
  lefthook: 2.2.1
  stylelint: ^17.16.0
  stylelint-config-standard: ^40.0.0
  stylelint-declaration-strict-value: ^1.12.1
  typescript-eslint: ^8.71.2
