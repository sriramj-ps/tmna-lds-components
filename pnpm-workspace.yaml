# Which folders hold workspace packages
packages:
  - 'packages/*'
  - 'packages/organisms/*'
  - 'apps/*'
  - 'tools/*'

# ---------- Supply-chain safety ----------
# Only these packages may run install scripts (postinstall etc.)
allowBuilds:
  nx: true
  esbuild: true
  '@swc/core': true
  lefthook: true
  # Explicitly denied: ships prebuilt binaries, its script is not needed
  '@parcel/watcher': false
  # Angular CLI build cache (apps/angular-example): prebuilt binaries, scripts not needed
  lmdb: false
  msgpackr-extract: false
# Fail the install if a package that is NOT in allowBuilds wants to run a script
strictDepBuilds: true
# Refuse versions published less than 1 day ago (minutes)
minimumReleaseAge: 1440
# Our own packages are exempt so a fresh release can be consumed right away
minimumReleaseAgeExclude:
  - '@tmna-cx-design-system/*'
  - '@tmna/*'
  - '@tmna-cx-ds-organisms/*'
# Refuse a new version if its publish trust level dropped (e.g. lost provenance)
trustPolicy: no-downgrade
# Only judge versions published in the last 30 days (old packages like semver@6 predate provenance)
trustPolicyIgnoreAfter: 43200

# ---------- Dependency behaviour ----------
autoInstallPeers: true
# Workspace packages must be referenced with workspace:* (never pulled from JFrog by accident)
linkWorkspacePackages: false
saveWorkspaceProtocol: rolling

# ---------- One place for shared versions ----------
# Packages write "typescript": "catalog:" instead of a version number
catalogMode: strict
catalog:
  nx: 23.3.0
  '@nx/js': 23.3.0
  '@nx/devkit': 23.3.0
  prettier: ^3.9.10
  '@swc/helpers': ~0.5.18
  typescript: ~6.0.3
  # Panda must match the peer version pinned by @tmna/panda-preset-base exactly
  '@pandacss/dev': 2.2.0
  '@pandacss/preset-base': 2.2.0
  '@stencil/core': ^4.45.2
  '@stencil/react-output-target': ^1.6.5
  '@stencil/angular-output-target': ^1.5.2
  react: ^19.3.0
  react-dom: ^19.3.0
  # Only for apps/react-example
  '@vitejs/plugin-react': ^6.1.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@angular/core': ^22.2.2
  '@angular/common': ^22.2.2
  '@angular/compiler': ^22.2.2
  '@angular/compiler-cli': ^22.2.2
  '@angular/platform-browser': ^22.2.2
  # Only for apps/angular-example (ng build / ng serve)
  '@angular/build': ^22.2.3
  '@angular/cli': ^22.2.3
  ng-packagr: ^22.2.4
  rxjs: ^7.8.2
  storybook: ^10.6.2
  '@storybook/web-components-vite': ^10.6.2
  '@storybook/addon-a11y': ^10.6.2
  '@storybook/addon-docs': ^10.6.2
  '@storybook/addon-vitest': ^10.6.2
  lit: ^3.3.3
  # Markdown tables in the Storybook guides
  remark-gfm: ^4.0.1
  # Generates React 19 / Preact / Solid JSX types from custom-elements.json
  '@wc-toolkit/jsx-types': 1.8.2
  vite: ^8.3.4
  vitest: ^5.0.4
  '@vitest/browser': ^5.0.4
  '@vitest/browser-playwright': ^5.0.4
  playwright: ^1.64.0
  publint: ^0.3.25
  '@types/node': ^24.0.0
  tslib: ^2.8.1
  '@nx/eslint': 23.3.0
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@eslint/js': ^10.0.1
  '@nx/eslint-plugin': 23.3.0
  '@typescript-eslint/parser': ^8.71.2
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  jiti: ^2.7.0
  lefthook: 2.2.1
  stylelint: ^17.16.0
